<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wake-up command setup prototype</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f6;--ink:#17222d;--mute:#5d6e7c;--card:#fff;--line:#d6dee5;--blue:#1f6feb;--vio:#7a4fd6;--amb:#d98a0b;--grn:#2c9a5a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151a;--ink:#e8eef1;--mute:#93a4ae;--line:#2a343b;--card:#1b2227}}
:root[data-theme="dark"]{--bg:#0f151a;--ink:#e8eef1;--mute:#93a4ae;--line:#2a343b;--card:#1b2227}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px;display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
h1{font-size:19px;margin:0 0 4px}h2{font-size:14px;margin:18px 0 6px}.mute{color:var(--mute);font-size:13px}
.setup{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;cursor:pointer;font:inherit}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
label.row{display:flex;gap:8px;align-items:center;font-size:14px}
input[type=range]{width:100%}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.phone{width:320px;min-height:600px;margin:0 auto;border-radius:36px;border:10px solid #1a232b;background:#f7f9fb;color:#17222d;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.phone.bzz{animation:bzz .45s}
@keyframes bzz{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px)}30%{transform:translateX(5px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:5px 12px;border-radius:16px;color:#fff;background:#6b7c89}
.st i{width:9px;height:9px;border-radius:50%;background:#fff}
.hap{font-size:12px;color:#5d6e7c;border:1px solid #d6dee5;border-radius:12px;padding:3px 9px;background:#fff}
.ringbox{position:relative;width:180px;height:180px;margin:6px auto}
.ringbox svg{width:180px;height:180px;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:12;stroke-linecap:round}
.ringmid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:30px;font-weight:700}
.ringmid small{display:block;font-size:12px;font-weight:400;color:#5d6e7c}
.msg{text-align:center;font-size:19px;font-weight:600;min-height:30px}
.sub{text-align:center;color:#5d6e7c;font-size:13px;min-height:36px}
.cap{background:#fff;border:1px solid #d6dee5;border-radius:12px;padding:12px;font-size:18px;min-height:56px;text-align:center}
.cap mark{background:#fde9c4;border-radius:4px;padding:0 3px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{border:0;border-radius:12px;padding:13px;font:600 15px system-ui;cursor:pointer;background:#e4eaf0;color:#17222d;text-align:center}
.btn.p{background:var(--blue);color:#fff}.btn.g{background:var(--grn);color:#fff}.btn.o{background:#fff;border:2px solid var(--amb);color:#8a5600}
.tiles{display:grid;grid-template-columns:1fr;gap:8px}.tiles .btn{font-size:18px;padding:16px}
.check{font-size:56px;text-align:center;color:var(--grn)}
.note{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px;font-size:13px}
.note b{font-weight:600}
.col{display:flex;flex-direction:column;gap:14px;align-items:center}
.demo{width:320px;border:2px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.demo h3{margin:0;font-size:12px;color:var(--mute);font-weight:500}
.demo .btn{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px;font-size:14px}
.phone.off{background:#0b0f13;border-color:#1a232b}
.sr{position:absolute;left:-9999px}
.bars{display:flex;gap:6px;align-items:center;justify-content:center;height:72px}
.bars i{width:9px;height:18px;background:var(--amb);border-radius:5px}
.bars.on i{animation:eq .6s infinite alternate}
.bars.on i:nth-child(2){animation-delay:.1s}.bars.on i:nth-child(3){animation-delay:.2s}.bars.on i:nth-child(4){animation-delay:.3s}.bars.on i:nth-child(5){animation-delay:.15s}
@keyframes eq{from{height:14px}to{height:66px}}
.txt{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
@media(prefers-reduced-motion:reduce){.bars.on i{animation:none;height:44px}}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.phone.bzz{animation:none}}
.phone{position:relative;overflow:hidden}
.pulse{width:110px;height:110px;margin:14px auto;border-radius:50%;border:6px solid var(--blue);animation:pul 1.4s infinite}
@keyframes pul{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.25);opacity:.15}}
.big{text-align:center;font-size:30px;font-weight:700;margin:26px 0}
.taps{display:flex;gap:14px;justify-content:center;margin:30px 0}.taps i{width:26px;height:26px;border-radius:50%;background:var(--amb)}
.list{background:#fff;border:1px solid #d6dee5;border-radius:12px;padding:10px 12px;font-size:14px}.list div+div{margin-top:6px}
.phone.jolt2{animation:j2 .7s}.phone.jolt3{animation:j3 1.1s}
@keyframes j2{0%,100%{transform:translateY(0)}15%{transform:translateY(6px)}30%{transform:translateY(0)}55%{transform:translateY(6px)}70%{transform:translateY(0)}}
@keyframes j3{0%,100%{transform:translateY(0)}10%{transform:translateY(6px)}20%{transform:translateY(0)}40%{transform:translateY(6px)}50%{transform:translateY(0)}70%{transform:translateY(6px)}80%{transform:translateY(0)}}
.rip{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(31,111,235,.4);animation:rip .6s forwards;pointer-events:none}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
@media(prefers-reduced-motion:reduce){.pulse,.phone.jolt2,.phone.jolt3,.rip{animation:none}}
.btn.r{background:#d9453f;color:#fff}.btn.xl{padding:18px;font-size:17px}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.cmds{width:320px;border:2px solid var(--ink);border-radius:4px;padding:14px 16px;background:var(--card);color:var(--ink);font-size:15px;line-height:1.7}
.devtitle{width:320px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--ink);margin:-4px 0 12px}
.devtitle .devarrow{width:18px;height:30px;flex:none}
.cmds b{letter-spacing:.08em;font-size:13px}
.cmds div{display:flex;gap:8px}.cmds .n{flex:none}.cmds .none{color:var(--mute)}
.micnote{color:#b3261e;font-size:12px;text-align:center}
</style></head><body>

function playTap(){try{new Audio(TAP).play().catch(()=>{})}catch(e){}}
function later(f,ms){const t=setTimeout(f,ms);timers.push(t);return t}

function anim(cls){const p=$('phone');p.classList.remove('bzz','jolt2','jolt3');void p.offsetWidth;if(cls)p.classList.add(cls)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function cueThenRelease(tk,cue){
 const release=()=>{if(S.tok===tk){S.hold=false;S.left=S.pat}};
 if(!cue){release();return}
 say('Please '+cue+' after the beep.',()=>{if(S.tok!==tk)return;playBeep();later(release,beepMs()+100)},{max:8000})}
function ask(t,cb,extra,cue){const tk=S.tok;S.hold=true;
 say(t,()=>{if(S.tok!==tk)return;if(cb)cb();later(()=>{if(S.tok===tk)cueThenRelease(tk,cue)},extra||0)},{max:20000})}
function clapMs(){return Math.min(((clapAudio.duration||0.9)*1000)+250,4000)}
function playClap(){try{clapAudio.currentTime=0;clapAudio.play().catch(()=>{})}catch(e){}}
function go(st,hold){S.tok++;S.st=st;S.hint='';S.hold=!!hold;S.left=S.pat;if(st==='retry'){S.fails=0;S.restartPrompt=false}if(st==='record'){S.dups=0;S.restartPrompt=false}draw();enter(st)}
function nudge(m){const tk=S.tok;S.hint=m;S.hold=true;draw();say(m,()=>{if(S.tok===tk)cueThenRelease(tk,'say your command')},{max:20000})}
const BK_RESTART='Please try again. You can tap one of the two big buttons on the screen, or say restart backup setup, or restart from beginning.';
const PR_RESTART='Please try again. You can tap the big red button on the screen, or say restart, to start over.';
function enter(st){
 if(st==='intro')say('Set up voice activation. Choose a command to wake me, then a backup.',()=>{if(S.st==='intro')say('Tap the screen to get started.')},{max:9000,idle:3000});
 else if(st==='choose')say('Your wake-up command can be a word, a series of taps on the screen, or a series of claps or other sounds.',()=>{if(S.st==='choose')go('record')},{max:14000,idle:5000});
 else if(st==='record'){const t=S.phase==='primary'?'Please speak, clap, or tap your chosen command now.':S.pre+'Please set a backup wake-up command. It can be spoken, a clap, or taps, but it needs to be different from your first.';S.pre='';ask(t,null,0,'say your command')}
 else if(st==='retry')ask('Please try it again to confirm.',null,0,'say your command');
 else if(st==='cconfirm'){buzz('two short pulses',[40,60,40]);ask('Is this correct?'+(S.cmd.type==='tap'?' '+cap(said(S.cmd))+'.':''),()=>playCmd(S.cmd),S.cmd.type==='clap'?clapMs():S.cmd.type==='tap'?400+S.cmd.n*330:1200,'say yes or no')}
 else if(st==='ready'){buzz('rising pulses',[30,60,30,60,200]);ask('You are all set. Your wake-up command is '+said(S.primary)+'. Your backup is '+said(S.backup)+'. Say finish, or tap the big blue button, to finish setup.',null,0,'say finish')}
 else if(st==='noinput')ask(S.prev&&['listen','check'].includes(S.prev)?'I did not detect any input. Tap the large Continue button, or say continue, to continue.':'I did not detect any input. Tap the large Continue button, or say continue, to continue the setup.',null,0,'say continue');
 else if(st==='listen')ask(S.restate?'Please say what you said again.':'I am listening. Take your time.',null,0,'say your request');
 else if(st==='check')ask(S.checkText,null,0,'say yes or no');
 else if(st==='alarm'){beep();vib([300,150,300]);say('Your timer is done. Say stop, or tap Stop.');alarmInt=setInterval(()=>{if(S.st==='alarm')beep();else clearInterval(alarmInt)},1500)}
 else if(st==='done')ask(S.ans+' Anything else?',null,0,'say your request');
}
function playCmd(c){if(S.st!=='cconfirm')return;
 if(c.type==='clap'){const b=$('bars');if(b)b.classList.add('on');playClap();later(()=>{const x=$('bars');if(x)x.classList.remove('on')},clapMs())}
 else if(c.type==='tap')jolt(c.n);else say(c.word)}
function ripple(x,y){const p=$('phone'),r=document.createElement('span');r.className='rip';r.style.left=x+'px';r.style.top=y+'px';p.appendChild(r);setTimeout(()=>r.remove(),600)}
// ---- setup logic (one "capture a command" module, run twice)
function onCommand(type,n,word){n=Math.min(n||1,6);const c={type,n,word:word||''},st=S.st;
 if(st==='record'||st==='retry'){S.left=S.pat;
  if(type==='tap'&&n<2){nudge('One tap is easy to trigger by accident. Try two or more.');return}
  if(type==='word'&&RESERVED.includes(c.word.toLowerCase())){nudge('That word is reserved. Please choose a different word.');return}
  if(st==='record'){
   if(S.phase==='backup'&&same(c,S.primary)){S.dups++;if(S.dups>=2)S.restartPrompt=true;nudge("Your backup cannot be the same as your wake-up command. Try something different.");return}
   S.cmd=c;go('cconfirm')}
  else if(same(c,S.cmd)){
   if(S.phase==='primary'){S.primary=S.cmd;S.phase='backup';S.cmd=null;S.pre='That matched. ';go('record')}
   else{S.backup=S.cmd;go('ready')}}
  else{S.fails++;
   if(S.fails>=2){S.fails=0;S.restartPrompt=true;nudge(S.phase==='primary'?PR_RESTART:BK_RESTART)}
   else nudge(S.phase==='primary'?"That's not an exact match. Please try again.":"Please try again. It needs to match your backup command exactly.")}}
 else if(st==='sleep'){if(same(c,S.primary)||same(c,S.backup))begin()}}
function yes(){if(S.st==='cconfirm')go('retry');else if(S.st==='check')finish()}
function no(){if(S.st==='cconfirm'){if(S.phase==='primary'){S.cmd=null;go('choose')}else{S.cmd=null;S.pre="Okay, let's try again. ";go('record')}}else if(S.st==='check')restate()}
function restartSetup(){clearAll();S.phase='primary';S.primary=null;S.backup=null;S.cmd=null;S.unsure=null;S.pre='';S.restate=false;go('intro')}
function restartBackup(){clearAll();S.cmd=null;S.pre='';go('record')}
let burst={n:0,t:null};
function countTap(){burst.n++;clearTimeout(burst.t);burst.t=setTimeout(()=>{const n=burst.n;burst.n=0;onCommand('tap',n)},450)}
$('phone').addEventListener('pointerdown',e=>{
 if(S.st==='intro'){if(!e.target.closest('button')){startMic();go('choose')}return}
 if(S.st==='off'){restartSetup();return}
 if(e.target.closest('button'))return;
 if(!['record','retry','sleep'].includes(S.st))return;
 const r=$('phone').getBoundingClientRect();ripple(e.clientX-r.left,e.clientY-r.top);countTap()});
// ---- no-input rule and conversation
function noInputRule(){S.prev=S.st;go('noinput')}
function continueNow(){if(S.st!=='noinput')return;go(S.prev||'record')}
function goodbye(){say('No input detected, goodbye.');go(S.primary&&S.backup?'sleep':'off')}
function expire(){const st=S.st;
 if(st==='pause')toCheck();
 else if(st==='noinput'||st==='done')goodbye();
 else if(st==='listen'&&!S.restate){go('sleep');say('No rush. Wake me up when you are ready.')}
 else noInputRule()}
function begin(){S.restate=false;S.unsure=null;S.utt='';S.lowConf=false;go('listen');buzz('two short pulses',[40,60,40])}
function restate(){S.restate=true;S.unsure=null;S.utt='';S.lowConf=false;go('listen')}
function ring(){const C=2*Math.PI*78,f=Math.max(0,S.left/S.pat),st=S.st;
 const lbl=st==='pause'?'seconds of quiet left':st==='hear'?'paused while you speak':st==='noinput'?'seconds before I stop':st==='done'?'seconds before I rest':'seconds I will wait';
 return `<div class="ringbox"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="78" stroke="#dbe3ea"/><circle id="arc" cx="90" cy="90" r="78" stroke="${ST[st][1]}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}"/></svg><div class="ringmid"><div><span id="secs">${Math.ceil(Math.max(0,S.left))}</span><small>${lbl}</small></div></div></div>`}
function capHtml(){if(S.unsure!==null)return S.words.map((w,i)=>i===S.unsure?`<mark>${esc(w)}</mark>`:esc(w)).join(' ');return esc(S.cap)||'&nbsp;'}
const hint=()=>S.hint?`<br><b>${S.hint}</b>`:'';
const yn=(a,b)=>`<div class="btns"><button class="btn g" id="b-yes">${a}</button><button class="btn o" id="b-fix">${b}</button></div>`;
const dots=n=>`<div class="taps">${'<i></i>'.repeat(n)}</div>`;
function visual(c){return c.type==='clap'?'<div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>':c.type==='tap'?dots(c.n):`<div class="big">“${esc(c.word)}”</div>`}
function restartBtns(){return !S.restartPrompt?'':S.phase==='primary'?'<div class="btns"><button class="btn r xl" id="b-rbeg">Restart</button></div>':'<div class="btns"><button class="btn r xl" id="b-rbk">Restart backup setup</button><button class="btn r xl" id="b-rbeg">Restart from beginning</button></div>'}
const cmdText=c=>c.type==='word'?'"'+esc(c.word)+'"':'*'+Array(c.n).fill(c.type).join(' ')+'*';
function updateCmds(){const row=(n,c)=>`<div><span class="n">${n}.</span>${c?`<span>${cmdText(c)}</span>`:'<span>&nbsp;</span>'}</div>`;
 $('cmds').innerHTML='<b>WAKE COMMANDS:</b>'+row(1,S.primary)+row(2,S.backup)}
function draw(){
 const [lab,col]=ST[S.st];let body='';const st=S.st,bk=S.phase==='backup',blank=st==='sleep'||st==='off';
 if(blank)body='<span class="sr">Device asleep</span>';
 else if(st==='intro')body=`<div class="bars" style="margin-top:50px"><i></i><i></i><i></i><i></i><i></i></div><div class="msg">Set up voice activation</div><div class="sub">Choose a command to wake me, then a backup.<br><b>Tap the screen to get started.</b></div><div class="btns"><button class="btn p" id="b-start">Get started</button></div>`;
 else if(st==='choose')body=`<div class="msg" style="margin-top:16px">Choose your wake-up command</div><div class="sub">It can be:</div><div class="list"><div>A spoken word</div><div>A series of taps on the screen (more than one)</div><div>A single clap, a series of claps, or other sounds</div></div>`;
 else if(st==='record')body=`<div class="pulse"></div><div class="msg">${bk?'Set a backup wake-up command':'Please speak, clap, or tap your chosen command now'}</div><div class="sub">${bk?'Spoken, a clap, or taps. It needs to be different from your first.':'A word, taps on the screen, or claps.'}${hint()}</div>${restartBtns()}`;
 else if(st==='retry')body=`<div class="pulse"></div><div class="msg">Please try it again to confirm</div><div class="sub">${bk?'Your backup':'Your wake-up command'}${hint()}</div>${restartBtns()}`;
 else if(st==='cconfirm')body=`<div class="msg" style="margin-top:14px">Is this correct?</div>${visual(S.cmd)}<div class="sub">${bk?'Backup: ':''}${desc(S.cmd)}<br>Tap, or just say yes or no.</div>${yn("Yes, that's right",'No, try again')}`;
 else if(st==='ready')body=`<div class="check">✓</div><div class="msg">You're all set</div><div class="list"><div><b>Wake-up:</b> ${desc(S.primary)}</div><div><b>Backup:</b> ${desc(S.backup)}</div></div><div class="sub">The screen will go blank. Use either one to wake me.</div><div class="btns"><button class="btn p xl" id="b-done">Finish</button></div>`;
 else if(st==='noinput')body=`${ring()}<div class="msg">I did not detect any input</div><div class="sub">Tap Continue, or say “continue”.</div><div class="btns"><button class="btn p xl" id="b-cont">Continue</button></div>`;
 else if(st==='listen')body=`${ring()}<div class="msg">${S.restate?'Please say it again.':"I'm listening. Take your time."}</div><div class="sub">I won't cut you off while you speak.</div>`;
 else if(st==='hear')body=`${ring()}<div class="cap" id="cap">${capHtml()}</div><div class="sub">Live captions as you speak</div>`;
 else if(st==='pause')body=`${ring()}<div class="cap">${capHtml()}</div><div class="sub">Pause timer. Keep talking if you're not done.</div>`;
 else if(st==='check')body=`<div class="msg">I heard:</div><div class="cap">${capHtml()}</div><div class="sub">${S.unsure!==null?`I'm not sure about "${esc(S.words[S.unsure])}". Is this right?`:S.lowConf?"I'm not sure I heard that right. Is this right?":'Is this right?'}<br>Tap, or just say yes or no.</div><div class="btns"><button class="btn g" id="b-yes">Yes, that's right</button><button class="btn o" id="b-fix">No, say it again</button></div>`;
 else if(st==='think')body=`${ring()}<div class="msg">Working on it…</div>`;
 else if(st==='alarm')body=`<div class="check">⏰</div><div class="msg">Timer done</div><div class="sub">${esc(S.timerLabel)}</div><div class="btns"><button class="btn r xl" id="b-stop">Stop</button></div>`;
 else body=`${ring()}<div class="cap" style="text-align:left;font-size:16px">${esc(S.ans)}</div><div class="sub">Anything else? I'll wait a moment.</div>`;
 const p=$('phone');p.classList.toggle('off',blank);updateCmds();
 p.innerHTML=blank?body:`<div class="bar"><span class="st" style="background:${col}"><i></i>${lab}</span><span class="hap" id="hap">Buzz: ${S.hap}</span></div>${body}${S.micNote?`<div class="micnote">${esc(S.micNote)}</div>`:''}`;
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('b-start',()=>{startMic();go('choose')});
 on('b-rbeg',restartSetup);on('b-rbk',restartBackup);
 on('b-yes',yes);on('b-fix',no);
 on('b-done',()=>go('sleep'));on('b-cont',continueNow);on('b-stop',stopAlarm);
}
function toCheck(){if(S.st!=='pause')return;S.unsure=S.pendU;const t=S.words.join(' ').toLowerCase();
 if(S.unsure!==null){buzz('long, then short (not sure)',[200,80,60]);S.checkText='I heard '+t+'. I am not sure about '+S.words[S.unsure]+'. Is that right?'}else if(S.lowConf){buzz('long, then short (not sure)',[200,80,60]);S.checkText='I heard '+t+'. I am not sure I got that right. Is that right?'}else S.checkText='I heard '+t+'. Is that right?';
 go('check')}
let sample=null,alarmInt=null,actx=null;
function setAi(m){}
(async()=>{try{if(window.claude&&claude.use)sample=await claude.use('sample')}catch(e){sample=null}
 setAi(sample?'Answers come from Claude on your account. The first request asks your permission.':'Answers are not available in this view, so I can only set timers.')})();
function parseSeconds(t){const m=norm(t).match(/(\d+|[a-z]+)\s*(second|sec|minute|min|hour|hr)s?/);if(!m)return 0;const v=/^\d+$/.test(m[1])?+m[1]:WORDNUM[m[1]];return v?v*({second:1,sec:1,minute:60,min:60,hour:3600,hr:3600}[m[2]]):0}
const fmtDur=s=>s>=60&&s%60===0?(s/60)+(s===60?' minute':' minutes'):s+' seconds';
async function answer(u){
 const local=()=>{const s=parseSeconds(u);return s?{reply:'Okay, timer set for '+fmtDur(s)+'.',seconds:s}:{reply:'I heard “'+u+'”, but without Claude I can only set timers.',seconds:0}};
 if(!sample)return local();
 const hist=S.hist.slice(-6).map(x=>x.role+': '+x.text).join('\n');
 const prompt='You are the voice of an accessible voice assistant. Answer the user\'s latest request in at most two short, plain spoken sentences. No markdown, lists, or emoji. If they ask for a timer, set timer_seconds to the total number of seconds, otherwise null. Return only JSON: {"reply": string, "timer_seconds": number or null}.\n\nEarlier turns:\n'+(hist||'(none)')+'\n\nThe user said: '+u;
 try{const j=await sample.json(prompt,{modelTier:'quick',cache:false});const reply=String(j.reply||'').slice(0,400)||'Okay.';const secs=Number(j.timer_seconds)>0?Math.min(Math.round(j.timer_seconds),86400):0;
  S.hist.push({role:'User',text:u},{role:'Assistant',text:reply});return{reply,seconds:secs}}
 catch(e){setAi(e&&e.code==='not_granted'?'Answers are off because the permission prompt was declined.':'Claude could not be reached just now, so only timers work.');return local()}}
async function finish(){const u=(S.utt||S.words.join(' ')).trim();S.utt='';S.lowConf=false;go('think');buzz('steady pulse',[80]);
 const r=await answer(u);if(S.st!=='think')return;
 S.ans=r.reply;if(r.seconds)S.timer={end:Date.now()+r.seconds*1000,secs:r.seconds};
 go('done');buzz('rising pulses',[30,60,30,60,200])}
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=880;g.gain.value=0.2;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.35)}catch(e){}}
function stopAlarm(){if(S.st!=='alarm')return;clearInterval(alarmInt);try{speechSynthesis.cancel()}catch(e){}go('sleep')}
setInterval(()=>{if(S.timer&&Date.now()>=S.timer.end){S.timer=null;S.timerLabel='Your timer is done.';go('alarm')}
 if(!WAITING.includes(S.st)||S.hold)return;S.left-=0.1;
 if(S.left<=0){expire();return}
 const a=$('arc');if(a){const C=2*Math.PI*78;a.setAttribute('stroke-dashoffset',C*(1-S.left/S.pat))}
 const s=$('secs');if(s)s.textContent=Math.ceil(S.left)},100);
// ---- real microphone: claps (volume) and speech (browser speech recognition)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let ctx,an,mic=false,cnt=0,lastHit=0,clapT=null,base=0.01,rec=null,lastSpeechAt=-9999,prevR=0,onset=null;
const WORDNUM={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30,sixty:60};
const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function parseMinutes(t){const m=norm(t).match(/(\d+|[a-z]+)\s+minutes?/);if(!m)return null;const v=/^\d+$/.test(m[1])?+m[1]:WORDNUM[m[1]];return v||null}
function speechCommand(t){const st=S.st;
 const Y=/^(yes|yeah|yep|yup|correct|right|sure|that is right|that's right)$/,N=/^(no|nope|nah|incorrect|wrong)$/;
 if(st==='cconfirm'||st==='check'){if(Y.test(t))yes();else if(N.test(t))no();return}
 if(st==='ready'){if(t==='finish'||t==='finish setup')go('sleep');return}
 if(st==='noinput'){if(t==='continue')continueNow();return}
 if(st==='alarm'){if(/^(stop|ok|okay|dismiss|cancel|done)$/.test(t))stopAlarm();return}
 if((st==='record'||st==='retry')&&S.restartPrompt){
  if(t==='restart backup setup'&&S.phase==='backup'){restartBackup();return}
  if(t==='restart from beginning'||(t==='restart'&&S.phase==='primary')){restartSetup();return}}
 if(st==='record'||st==='retry'||st==='sleep')onCommand('word',1,t)}
function onRequestSpeech(interim,fin,conf){
 if(!interim&&!fin)return;
 if(S.st!=='hear'){S.cap=(S.utt+' '+(interim||fin)).trim();go('hear',true)}
 if(fin){S.utt=(S.utt+' '+fin).trim();S.lowConf=conf<0.7;S.words=S.utt.split(' ');S.cap=S.utt;S.unsure=null;S.pendU=null;S.n=parseMinutes(S.utt)||10;go('pause');return}
 S.cap=(S.utt+' '+interim).trim();const c=$('cap');if(c)c.textContent=S.cap}
function onSpeech(ev){if(talking||micMute||muted())return;
 let interim='',fin='',conf=1;
 for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal){fin+=' '+r[0].transcript;conf=Math.min(conf,r[0].confidence||1)}else interim+=' '+r[0].transcript}
 interim=interim.trim();fin=fin.trim();
 if(interim||fin){lastSpeechAt=performance.now();clearTimeout(clapT);cnt=0;onset=null}
  if(['listen','done','pause','hear'].includes(S.st)){onRequestSpeech(interim,fin,conf);return}
 if(fin)speechCommand(norm(fin))}
function startSpeech(){
 if(!SR){S.micNote='Speech recognition is not supported in this browser. Use Chrome, Edge, or Safari for spoken input.';draw();return}
 rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';rec.onresult=onSpeech;
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){mic=false;S.micNote='The browser blocked speech recognition here. Allow the microphone, or open the file in Chrome.';draw()}};
 rec.onend=()=>{if(mic){try{rec.start()}catch(e){}}};
 try{rec.start()}catch(e){}}
let micStarted=false;
async function startMic(){if(micStarted)return;micStarted=true;
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
  try{ctx=new (window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(s).connect(an)}catch(x){an=null}
  mic=true;if(an)loop();startSpeech()}
 catch(err){S.micNote='Microphone blocked. Allow it in the browser to use voice and claps.';draw()}}
function deliverClaps(){const n=cnt;cnt=0;if(!n||performance.now()-lastSpeechAt<1500)return;onCommand('clap',n)}
function loop(){if(!mic||!an)return;requestAnimationFrame(loop);
 const t=new Uint8Array(an.fftSize);an.getByteTimeDomainData(t);let r=0;for(const v of t){const x=(v-128)/128;r+=x*x}r=Math.sqrt(r/t.length);
 const clapWake=S.st==='sleep'&&((S.primary&&S.primary.type==='clap')||(S.backup&&S.backup.type==='clap'));
 const live=!micMute&&!muted()&&!talking&&(['record','retry'].includes(S.st)||clapWake),now=performance.now();
 if(!live){base=r;cnt=0;onset=null;prevR=r;clearTimeout(clapT);return}
 // a clap is a sharp, very short burst. Speech stays loud, so it is rejected.
 if(!onset){base=base*0.98+r*0.02;
  if(r>Math.max(0.12,base*6)&&r>prevR*2&&now-lastHit>150)onset={t:now,peak:r}}
 else{onset.peak=Math.max(onset.peak,r);
  if(now-onset.t>=140){const short=r<onset.peak*0.4,heardSpeech=now-lastSpeechAt<1200;onset=null;lastHit=now;
   if(short&&!heardSpeech){cnt++;clearTimeout(clapT);clapT=setTimeout(deliverClaps,650)}}}
 prevR=r}
draw();enter('intro');
</script></body></html>
